[project]
name = "agentgate"
version = "0.1.0"
description = "Governed MCP + Skills agent platform over a legacy engineering-ops system"
requires-python = ">=3.11"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
